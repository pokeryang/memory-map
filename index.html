<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>回忆地图</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#12100e; --bg2:#1b1815; --bg3:#241f1b; --line:#3a322c;
  --ink:#f2ece4; --ink2:#b8ab9c; --ink3:#7d7267;
  --accent:#e0a04a; --accent2:#c96f4a; --ok:#5aa87a; --warn:#d4763f; --err:#c9524a;
  --r:14px; --r2:10px; --sh:0 10px 30px rgba(0,0,0,.45);
  --sheet-h:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#map{position:absolute;inset:0;background:#0b0a09}
.leaflet-container{background:#0b0a09;font:inherit}
.leaflet-control-attribution{background:rgba(18,16,14,.7)!important;color:var(--ink3)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-bar{border:0!important;box-shadow:var(--sh)!important}
.leaflet-bar a{background:var(--bg2)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--bg3)!important}

/* ---------- generic chrome ---------- */
.panel{background:rgba(27,24,21,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.hd{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}
.brand{display:flex;align-items:center;gap:9px;padding:9px 13px}
.brand b{font-size:15px;font-weight:600;letter-spacing:.5px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
  background:rgba(27,24,21,.94);border:1px solid var(--line);color:var(--ink2);font-size:12px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;box-shadow:var(--sh)}
.chip:hover{color:var(--ink);border-color:#4d423a}
.chip.on{color:#1a1512;background:var(--accent);border-color:var(--accent);font-weight:600}
.chip .i{font-size:13px;line-height:1}
.sync{cursor:pointer}
.sync .led{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.sync.ok .led{background:var(--ok)}
.sync.off .led{background:var(--err)}
.sync.busy .led{background:var(--accent);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}

.tr{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:600;display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* ---------- layer switcher ---------- */
.lyr{width:206px;padding:8px;display:none}
.lyr.open{display:block}
.lyr .grp{font-size:10px;letter-spacing:1px;color:var(--ink3);padding:7px 8px 5px}
.lyr button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r2);
  color:var(--ink2);font-size:13px;text-align:left}
.lyr button:hover{background:var(--bg3);color:var(--ink)}
.lyr button.on{background:var(--bg3);color:var(--ink);font-weight:600}
.lyr button .sw{width:22px;height:22px;border-radius:6px;flex:0 0 auto;border:1px solid var(--line);background-size:cover;background-position:center}
.lyr .sep{height:1px;background:var(--line);margin:7px 4px}
.lyr .tog{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:12.5px;color:var(--ink2)}
.sws{position:relative;width:38px;height:21px;border-radius:999px;background:#3a322c;flex:0 0 auto;transition:background .15s}
.sws i{position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#8b7f72;transition:.15s}
.sws.on{background:var(--accent)}
.sws.on i{left:19.5px;background:#1a1512}

/* ---------- left drawer ---------- */
.drawer{position:absolute;z-index:620;top:calc(64px + env(safe-area-inset-top));left:12px;bottom:132px;width:330px;
  display:flex;flex-direction:column;overflow:hidden;transition:transform .26s cubic-bezier(.4,0,.2,1),opacity .2s}
.drawer.hide{transform:translateX(-118%);opacity:0;pointer-events:none}
.dr-top{padding:11px;border-bottom:1px solid var(--line);flex:0 0 auto}
.srch{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.srch input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13px}
.srch input::placeholder{color:var(--ink3)}
.srch .x{color:var(--ink3);font-size:15px;padding:0 2px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tg{padding:5px 10px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);color:var(--ink2);
  display:inline-flex;align-items:center;gap:5px;line-height:1.3}
.tg .d{width:7px;height:7px;border-radius:50%}
.tg.on{color:#1a1512;font-weight:600;border-color:transparent}
.geo{max-height:214px;overflow:auto;border-bottom:1px solid var(--line);display:none}
.geo.open{display:block}
.geo .it{padding:10px 13px;border-bottom:1px solid rgba(58,50,44,.5);cursor:pointer}
.geo .it:hover{background:var(--bg3)}
.geo .it b{display:block;font-size:13px;font-weight:500}
.geo .it span{font-size:11px;color:var(--ink3)}
.list{flex:1;overflow:auto;overscroll-behavior:contain}
.card{display:flex;gap:11px;padding:11px 12px;border-bottom:1px solid rgba(58,50,44,.55);cursor:pointer;position:relative}
.card:hover{background:rgba(36,31,27,.75)}
.card.act{background:rgba(224,160,74,.11);box-shadow:inset 3px 0 0 var(--accent)}
.card.dim{opacity:.34}
.card .th{width:52px;height:52px;border-radius:9px;flex:0 0 auto;background:var(--bg3) center/cover;
  display:flex;align-items:center;justify-content:center;font-size:19px;overflow:hidden}
.card .bd{min-width:0;flex:1}
.card .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:11px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:11.5px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tgs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.card .tgs i{font-style:normal;font-size:10px;padding:2px 7px;border-radius:999px;background:var(--bg3);color:var(--ink2)}
.empty{padding:34px 22px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.9}
.dr-bt{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink3);flex:0 0 auto}
.lnk{color:var(--ink2);font-size:11px;text-decoration:none;border-bottom:1px dashed var(--line);cursor:pointer}
.lnk:hover{color:var(--accent)}

/* ---------- timeline ---------- */
.tl{position:absolute;z-index:620;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(740px,calc(100vw - 24px));padding:11px 14px 12px}
.tl-r1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tl-r1 .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px}
.tl-r1 .seg button{padding:6px 14px;border-radius:999px;font-size:12.5px;color:var(--ink2)}
.tl-r1 .seg button.on{background:var(--accent);color:#1a1512;font-weight:600}
.tl-when{margin-left:auto;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tl-when b{color:var(--accent);font-size:16px;font-weight:600;letter-spacing:.4px}
.tl-body{display:none;margin-top:11px}
.tl-body.open{display:block}
.yrs{display:flex;gap:3px;overflow:auto;padding-bottom:7px;scrollbar-width:none}
.yrs::-webkit-scrollbar{display:none}
.yrs button{padding:4px 9px;border-radius:7px;font-size:11.5px;color:var(--ink3);flex:0 0 auto}
.yrs button:hover{color:var(--ink)}
.yrs button.on{background:var(--bg3);color:var(--accent);font-weight:600}
.sld{display:flex;align-items:center;gap:10px;margin-top:2px}
.sld input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:22px;background:none}
.sld input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#3f362f}
.sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--accent);margin-top:-6.5px;border:2px solid #1a1512;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.sld input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3f362f}
.sld input[type=range]::-moz-range-thumb{width:15px;height:15px;border:2px solid #1a1512;border-radius:50%;background:var(--accent)}
.ib{width:31px;height:31px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.ib:hover{color:var(--ink);border-color:#4d423a}
.ib.on{background:var(--accent);color:#1a1512;border-color:var(--accent)}
.tl-r3{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.mini{font-size:11px;color:var(--ink3);padding:4px 9px;border:1px solid var(--line);border-radius:999px}
.mini:hover{color:var(--ink)}
.mini.on{color:#1a1512;background:var(--accent);border-color:var(--accent);font-weight:600}
.tl-note{font-size:10.5px;color:var(--ink3);margin-top:7px;line-height:1.6}

/* ---------- curtain ---------- */
#curtain{position:absolute;inset:0;z-index:450;display:none;pointer-events:none}
#curtain.on{display:block}
#curtain .bar{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.85);
  box-shadow:0 0 12px rgba(0,0,0,.6);pointer-events:none}
#curtain .grip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.94);color:#1a1512;display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:ew-resize;pointer-events:auto;box-shadow:0 3px 14px rgba(0,0,0,.5);touch-action:none}
#curtain .lb{position:absolute;top:14px;padding:5px 11px;border-radius:999px;background:rgba(18,16,14,.86);
  font-size:11.5px;color:var(--ink);white-space:nowrap;border:1px solid var(--line)}

/* ---------- markers ---------- */
.pin{position:relative;width:36px;height:36px;margin-left:-18px;margin-top:-40px;
  transition:transform .16s,filter .16s;will-change:transform}
.pin .bub{position:absolute;inset:0;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  border:2px solid rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(0,0,0,.55);overflow:hidden}
.pin .bub .im{position:absolute;inset:0;transform:rotate(45deg) scale(1.45);background-size:cover;background-position:center}
.pin .bub .em{position:absolute;inset:0;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;font-size:15px}
.pin.sel{transform:scale(1.24)}
.pin.dim{filter:grayscale(1) opacity(.4)}
.pin .lbl{position:absolute;top:38px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;
  padding:2px 7px;border-radius:6px;background:rgba(18,16,14,.86);color:var(--ink);border:1px solid var(--line);
  max-width:132px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.draft{width:24px;height:24px;margin-left:-12px;margin-top:-12px;border-radius:50%;border:3px solid #fff;
  background:var(--accent2);box-shadow:0 0 0 8px rgba(201,111,74,.28),0 2px 10px rgba(0,0,0,.5);animation:pp 1.5s infinite}
@keyframes pp{50%{box-shadow:0 0 0 16px rgba(201,111,74,.06),0 2px 10px rgba(0,0,0,.5)}}

/* ---------- sheet (detail / editor) ---------- */
.sheet{position:absolute;z-index:680;right:12px;top:calc(64px + env(safe-area-inset-top));bottom:132px;width:392px;
  display:flex;flex-direction:column;overflow:hidden;transform:translateX(118%);opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .2s}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sh-hd{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sh-hd b{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-bd{flex:1;overflow:auto;padding:13px;overscroll-behavior:contain}
.sh-ft{padding:11px 13px;border-top:1px solid var(--line);display:flex;gap:9px;flex:0 0 auto}
.btn{flex:1;padding:11px;border-radius:11px;font-size:13.5px;font-weight:600;text-align:center;
  background:var(--bg3);color:var(--ink);border:1px solid var(--line)}
.btn:hover{border-color:#544840}
.btn.p{background:var(--accent);color:#1a1512;border-color:var(--accent)}
.btn.p:hover{filter:brightness(1.07)}
.btn.d{flex:0 0 auto;width:46px;color:var(--err);font-size:15px}
.f{margin-bottom:14px}
.f>label{display:block;font-size:11px;letter-spacing:.6px;color:var(--ink3);margin-bottom:6px}
.f input[type=text],.f textarea,.f select,.f input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;outline:none;font-size:13.5px}
.f textarea{min-height:112px;resize:vertical;line-height:1.7}
.f input:focus,.f textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:9px;align-items:center}
.row>*{min-width:0}
.hint{font-size:10.5px;color:var(--ink3);margin-top:5px;line-height:1.6}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--bg3);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:rgba(0,0,0,.72);
  color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.ph.add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);color:var(--ink3);font-size:21px}
.ph.add:hover{border-color:var(--accent);color:var(--accent)}
.ph .sp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-size:11px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.meta i{font-style:normal;font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--bg3);color:var(--ink2)}
.story{font-size:14px;line-height:1.95;white-space:pre-wrap;word-break:break-word;color:#e8e0d6}
.crd{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:13px}
.crd h4{margin:0 0 7px;font-size:12.5px}
.crd p{margin:0;font-size:11.5px;color:var(--ink2);line-height:1.75}
.sql{background:#0d0c0b;border:1px solid var(--line);border-radius:9px;padding:10px;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#b9d8b0;max-height:180px;overflow:auto;white-space:pre;margin:9px 0}

/* ---------- fab / toast / lightbox / modal ---------- */
.fab{position:absolute;z-index:640;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:999px;background:var(--accent);color:#1a1512;
  font-size:14px;font-weight:700;box-shadow:0 8px 26px rgba(224,160,74,.32)}
.fab:hover{filter:brightness(1.07)}
.fab.on{background:var(--accent2);color:#fff}
.tip{position:absolute;z-index:700;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));
  padding:9px 17px;border-radius:999px;background:rgba(224,160,74,.95);color:#1a1512;font-size:12.5px;font-weight:600;
  display:none;box-shadow:var(--sh)}
.tip.on{display:block}
#toast{position:absolute;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
#toast div{padding:9px 17px;border-radius:999px;background:rgba(36,31,27,.96);border:1px solid var(--line);
  font-size:12.5px;box-shadow:var(--sh);animation:up .2s}
@keyframes up{from{opacity:0;transform:translateY(9px)}}
#lb{position:fixed;inset:0;z-index:950;background:rgba(8,7,6,.96);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:7px}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center}
#lb .nav.l{left:16px}#lb .nav.r{right:16px}
#lb .cl{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
#lb .cap{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-size:12px;color:#c9bfb3;text-align:center;max-width:88vw}
#modal{position:fixed;inset:0;z-index:920;background:rgba(8,7,6,.7);display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
.mw{width:min(520px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mw .sh-bd{padding:15px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3d342d;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:900px){
  .drawer{width:min(330px,calc(100vw - 24px))}
  .sheet{width:min(392px,calc(100vw - 24px))}
}
@media (max-width:640px){
  .hd{gap:6px}
  .brand{padding:7px 11px}.brand b{font-size:13.5px}
  .chip{padding:7px 10px;font-size:11.5px}
  .drawer{left:0;right:0;width:auto;top:auto;bottom:0;max-height:66vh;border-radius:16px 16px 0 0;border-bottom:0}
  .drawer.hide{transform:translateY(102%)}
  .sheet{left:0;right:0;width:auto;top:auto;bottom:0;max-height:88vh;border-radius:16px 16px 0 0;border-bottom:0}
  .sheet.open{transform:none}
  .sheet.hide{transform:translateY(102%)}
  .tl{width:calc(100vw - 16px);bottom:calc(8px + env(safe-area-inset-bottom));padding:9px 11px 10px}
  .tl-when b{font-size:14px}
  .fab{bottom:calc(132px + env(safe-area-inset-bottom));right:10px;padding:11px 15px;font-size:13px}
  .lyr{width:196px}
  #toast{bottom:calc(142px + env(safe-area-inset-bottom))}
  .leaflet-control-zoom{display:none}
  .leaflet-bottom.leaflet-right{bottom:calc(76px + env(safe-area-inset-bottom))}
  .leaflet-bottom.leaflet-left{bottom:calc(76px + env(safe-area-inset-bottom))}
  .leaflet-control-attribution{max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.72}
  body.sheet-on .leaflet-bottom{display:none}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="curtain">
  <div class="lb" id="cLeft">过去</div>
  <div class="lb" id="cRight">现在</div>
  <div class="bar" id="cBar"><div class="grip" id="cGrip">⇔</div></div>
</div>

<div class="hd">
  <div class="panel brand"><span class="dot"></span><b>回忆地图</b></div>
  <button class="chip sync" id="syncChip"><span class="led"></span><span id="syncTxt">本地</span></button>
  <button class="chip" id="listBtn"><span class="i">☰</span><span>回忆 <b id="cnt">0</b></span></button>
</div>

<div class="tr">
  <button class="chip" id="lyrBtn"><span class="i">◈</span><span>图层</span></button>
  <div class="panel lyr" id="lyrPanel"></div>
</div>

<div class="panel drawer hide" id="drawer">
  <div class="dr-top">
    <div class="srch">
      <span style="color:var(--ink3)">⌕</span>
      <input id="q" placeholder="搜回忆，或搜地名跳转…" autocomplete="off">
      <button class="x" id="qx" style="display:none">✕</button>
    </div>

  </div>

var PI=Math.PI, AA=6378245.0, EE=0.00669342162296594323;
function outCN(lat,lng){ return !(lng>=72.004&&lng<=137.8347&&lat>=0.8293&&lat<=55.8271); }
function tLat(x,y){ var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3; r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
  r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3; return r; }
function tLng(x,y){ var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3; r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
  r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3; return r; }
function wgs2gcj(lat,lng){
  if(outCN(lat,lng)) return [lat,lng];
  var dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  var rad=lat/180*PI, m=Math.sin(rad); m=1-EE*m*m; var sq=Math.sqrt(m);
  dLat=(dLat*180)/((AA*(1-EE))/(m*sq)*PI);
  dLng=(dLng*180)/(AA/sq*Math.cos(rad)*PI);
  return [lat+dLat,lng+dLng];
}
function gcj2wgs(lat,lng){
  if(outCN(lat,lng)) return [lat,lng];
  var g=wgs2gcj(lat,lng);
  var la=lat-(g[0]-lat), ln=lng-(g[1]-lng);
  for(var i=0;i<3;i++){ var t=wgs2gcj(la,ln); la+=lat-t[0]; ln+=lng-t[1]; }
  return [la,ln];
}

      if(!r.ok){ if(r.status===404) setSync("needsetup"); else { queueOp({t:"place",id:p.id}); setSync("offline"); } }
      return r; }).catch(function(){ queueOp({t:"place",id:p.id}); setSync("offline"); });
}
function delPlaceCloud(id){
  if(!S.secret) return Promise.resolve();
  return api(T_PHOTO+"?place_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}})
    .then(function(){ return api(T_PLACE+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}); })
    .then(function(r){ if(!r.ok&&r.status!==404) queueOp({t:"delPlace",id:id}); })
    .catch(function(){ queueOp({t:"delPlace",id:id}); });
}
function pushPhoto(ph){
  if(!S.secret) return Promise.resolve();
  return api(T_PHOTO+"?on_conflict=id",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify([{id:ph.id,place_id:ph.placeId,data:{img:ph.img,name:ph.name||"",w:ph.w||0,h:ph.h||0,createdAt:ph.createdAt||Date.now()}}])})
    .then(function(r){ if(!r.ok) queueOp({t:"photo",id:ph.id}); return r; })
    .catch(function(){ queueOp({t:"photo",id:ph.id}); });
}
function delPhotoCloud(id){
  if(!S.secret) return Promise.resolve();
  return api(T_PHOTO+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}})
    .then(function(r){ if(!r.ok&&r.status!==404) queueOp({t:"delPhoto",id:id}); }).catch(function(){ queueOp({t:"delPhoto",id:id}); });
}
function flushOutbox(){
  var ops=outbox(); if(!ops.length||!S.secret) return;
  setOutbox([]);
  ops.forEach(function(o){
    if(o.t==="place"){ var p=byId(o.id); if(p) pushPlace(p); }
    else if(o.t==="delPlace") delPlaceCloud(o.id);
    else if(o.t==="delPhoto") delPhotoCloud(o.id);
    else if(o.t==="photo"){ idb().then(function(db){ var tx=db.transaction("photos","readonly"),rq=tx.objectStore("photos").get(o.id);
      rq.onsuccess=function(){ if(rq.result) pushPhoto(rq.result); }; }).catch(function(){}); }
  });
}
function bootstrapCloud(){
  if(!S.secret){ setSync("locked"); return Promise.resolve(); }
  setSync("busy");
  return api(T_PLACE+"?select=*").then(function(r){
    if(r.status===404){ setSync("needsetup"); toast("云端还没建表，点右上角状态按钮一键完成"); promptSetup(); return; }
    if(!r.ok||!Array.isArray(r.data)){
      if(r.status===401||r.status===403){ setSync("locked"); toast("密钥不对，云端拒绝访问"); }
      else setSync("offline");
      return;
    }
    var cloud={}; r.data.forEach(function(row){ var p=placeOf(row); cloud[p.id]=p; });
    var local={}; S.places.forEach(function(p){ local[p.id]=p; });
    var merged={}, localOnly=[];
    Object.keys(local).forEach(function(id){ merged[id]=local[id]; if(!cloud[id]) localOnly.push(local[id]); });
    Object.keys(cloud).forEach(function(id){
      var c=cloud[id], l=local[id];
      merged[id]=(l&&(l.updatedAt||0)>(c.updatedAt||0))?l:c;
    });
    S.places=Object.keys(merged).map(function(k){ return merged[k]; });
    saveLocal(); setSync("synced"); renderAll(); fitIfFirst();
    localOnly.forEach(pushPlace);
    flushOutbox();
  }).catch(function(e){ console.warn(e); setSync("offline"); });
}
function loadPhotos(pid){
  var p=byId(pid), want=p?(p.photoCount||0):0;
  var cached=photoCache[pid]||[];
  if(cached.length>=want&&want>0) return Promise.resolve(cached.slice());
  return idbByPlace(pid).then(function(local){
    var seen={}, merged=[];
    cached.concat(local).forEach(function(x){ if(x&&!seen[x.id]){ seen[x.id]=1; merged.push(x); } });
    if(!S.secret||S.cloud!=="synced"||merged.length>=want) return merged;
    return api(T_PHOTO+"?place_id=eq."+encodeURIComponent(pid)+"&select=*").then(function(r){
      if(!r.ok||!Array.isArray(r.data)) return merged;
      var add=[];
      r.data.forEach(function(row){
        if(seen[row.id]) return;
        var d=row.data||{};
        var ph={id:row.id,placeId:row.place_id,img:d.img,name:d.name||"",w:d.w||0,h:d.h||0,createdAt:d.createdAt||0};
        add.push(ph); idbPut(ph);
      });
      return merged.concat(add);
    }).catch(function(){ return merged; });
  }).then(function(list){
    list.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
    photoCache[pid]=list; return list;
  });
}
function byId(id){ for(var i=0;i<S.places.length;i++) if(S.places[i].id===id) return S.places[i]; return null; }

function pinHtml(p,sel,dim){

function pastDate(){ return S.mode==="past"?(S.baseId==="eox"?(S.eoxYear+"-12-31"):WB[S.relIdx][0]):null; }
function isFuture(p){
  if(!S.syncPts||S.mode!=="past") return false;
  var d=pastDate(); if(!d) return false;
  var s=p.dateFrom||p.dateTo; if(!s) return false;
  return String(s).slice(0,10) > d;
}
function visible(p){
  if(S.tags.length){ var hit=(p.tags||[]).some(function(t){ return S.tags.indexOf(t)>=0; }); if(!hit) return false; }

  if(q){
    var hay=[p.title,p.story,p.place,(p.tags||[]).join(" "),p.dateFrom,p.dateTo].join(" ").toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function renderMarkers(){
  Object.keys(markers).forEach(function(id){ if(!byId(id)||!visible(byId(id))){ map.removeLayer(markers[id]); delete markers[id]; } });

    var ll=disp(p.lat,p.lng), dim=isFuture(p), sel=S.sel===p.id;
    var icon=L.divIcon({className:"",html:pinHtml(p,sel,dim),iconSize:[36,36],iconAnchor:[0,0]});
    if(markers[p.id]){ markers[p.id].setLatLng(ll); markers[p.id].setIcon(icon); }
    else{
      var m=L.marker(ll,{icon:icon,riseOnHover:true,zIndexOffset:sel?900:0}).addTo(map);
      m.on("click",function(){ openDetail(p.id); });

function renderTimeline(){

    });

    $("#tlNote").textContent="Esri Wayback 历史影像存档（0.3–1 米）。拖动滑块回到过去；“只看有变化的版本”会挑出这块地方真正翻新过的年份。";

function nearestPos(idx){
  var best=0,bd=1e9;
  relList.forEach(function(v,i){ var d=Math.abs(v-idx); if(d<bd){bd=d;best=i;} });
  return best;
}
function gotoPos(pos){
  pos=clamp(pos,0,relList.length-1);
  S.relIdx=relList[pos]; refreshWB();
}
function refreshWB(){ buildBase(); renderTimeline(); renderMarkers(); renderList(); }
function stopPlay(){ if(playTimer){ clearInterval(playTimer); playTimer=null; $("#playB").textContent="▶"; } }
function togglePlay(){
  if(playTimer) return stopPlay();
  if(S.baseId==="eox"){
    var i=EOX_YEARS.indexOf(S.eoxYear);
    playTimer=setInterval(function(){ i=(i+1)%EOX_YEARS.length; S.eoxYear=EOX_YEARS[i]; buildBase(); renderTimeline(); renderMarkers(); },1400);
  }else{
    var pos=relList.indexOf(S.relIdx); if(pos<0) pos=nearestPos(S.relIdx);
    playTimer=setInterval(function(){ pos=(pos+1)%relList.length; gotoPos(pos); },1300);
  }
  $("#playB").textContent="■";
}
/* which releases actually changed at this spot (Wayback tilemap byte-size trick) */
function refineChanged(){
  var c=map.getCenter(), z=clamp(Math.round(map.getZoom()),13,17);
  if(activeGroup()==="gcj"){ var w=gcj2wgs(c.lat,c.lng); c={lat:w[0],lng:w[1]}; }
  var t=ll2tile(c.lat,c.lng,z), key=z+"/"+t[0]+"/"+t[1];
  if(tmCache[key]){ applyChanged(tmCache[key]); return; }
  var done=0, sizes=new Array(WB.length), i=0, fail=0;
  $("#verInfo").textContent="扫描中 0/"+WB.length;
  function next(){
    if(i>=WB.length) return;
    var k=i++;
    fetch("https://wayback-a.maptiles.arcgis.com/arcgis/rest/services/world_imagery/wmts/1.0.0/default028mm/MapServer/tilemap/"+WB[k][1]+"/"+z+"/"+t[1]+"/"+t[0])
      .then(function(r){ return r.json(); })
      .then(function(j){ sizes[k]=(j&&j.size&&j.size[0])||0; })
      .catch(function(){ sizes[k]=-1; fail++; })
      .then(function(){
        done++; if(done%8===0) $("#verInfo").textContent="扫描中 "+done+"/"+WB.length;
        if(done===WB.length){
          if(fail>WB.length*0.4){ toast("影像扫描失败，改为显示全部版本"); S.onlyChg=false; renderTimeline(); return; }
          var keep=[],last=null;
          for(var n=0;n<WB.length;n++){ var s=sizes[n]; if(s<=0) continue; if(s!==last){ keep.push(n); last=s; } }
          if(keep.length<2) keep=WB.map(function(_,n){ return n; });
          tmCache[key]=keep; applyChanged(keep);
        } else next();
      });
  }
  for(var c2=0;c2<6;c2++) next();
}
function applyChanged(keep){
  relList=keep.slice();
  if(relList.indexOf(S.relIdx)<0) S.relIdx=relList[nearestPos(S.relIdx)];
  renderTimeline(); toast("这块地方共有 "+relList.length+" 个不同的影像版本");
}
function resetChanged(){ relList=WB.map(function(_,i){ return i; }); renderTimeline(); }

function sortPlaces(a,b){
  var da=(a.dateFrom||a.dateTo||""), db=(b.dateFrom||b.dateTo||"");
  if(da&&db&&da!==db) return db<da?-1:1;
  if(da&&!db) return -1;
  if(!da&&db) return 1;
  return (b.createdAt||0)-(a.createdAt||0);
}

function renderTagBar(){
  var used={}; S.places.forEach(function(p){ (p.tags||[]).forEach(function(t){ used[t]=(used[t]||0)+1; }); });
  var keys=TAGS.map(function(t){ return t.k; }).filter(function(k){ return used[k]; });

  var bar=$("#tagbar"); bar.innerHTML="";

function normDate(v){
  v=String(v||"").trim().replace(/[年月]/g,"-").replace(/日/g,"").replace(/\//g,"-").replace(/-+$/,"");
  if(/^\d{4}$/.test(v)) return v;
  if(/^\d{4}-\d{1,2}$/.test(v)){ var a=v.split("-"); return a[0]+"-"+("0"+a[1]).slice(-2); }
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(v)){ var b=v.split("-"); return b[0]+"-"+("0"+b[1]).slice(-2)+"-"+("0"+b[2]).slice(-2); }
  return v;
}

  pushPlace(p);
  newPhotos.forEach(function(x){ x._new=false; x.placeId=pid; idbPut(x); pushPhoto(x); });
  removed.forEach(function(id){ idbDel(id); delPhotoCloud(id); });

function attachLate(pid,ph){
  var p=byId(pid); if(!p) return;
  ph._new=false; idbPut(ph); pushPhoto(ph);
  var list=photoCache[pid]||[]; list.push(ph); photoCache[pid]=list;
  p.photoCount=(p.photoCount||0)+1;

function compress(file){
  return loadBitmap(file).then(function(src){
    var big=draw(src,1400,.8), small=draw(src,220,.72);
    if(src.close) src.close();
    return { img:big.url, thumb:small.url, w:big.w, h:big.h };
  });
}
function loadBitmap(file){
  if(!window.createImageBitmap) return viaImg(file);
  var done=false;
  var fast=new Promise(function(res,rej){
    var p;
    try{ p=createImageBitmap(file,{imageOrientation:"from-image"}); }catch(e){ rej(e); return; }
    p.then(function(b){ done=true; res(b); },function(e){ rej(e); });
  });
  var guard=new Promise(function(res,rej){
    setTimeout(function(){ if(!done) rej(new Error("bitmap timeout")); },2500);
  });
  return Promise.race([fast,guard]).catch(function(){ return viaImg(file); });
}
function viaImg(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ res(im); };
    im.onerror=function(){ URL.revokeObjectURL(u); rej(new Error("bad image")); };
    im.src=u;
  });
}
function thumbFromDataURL(u,max){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){ try{ res(draw(im,max||220,.72).url); }catch(e){ res(""); } };
    im.onerror=function(){ res(""); };
    im.src=u;
  });
}
function draw(src,max,q){
  var w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
  var s=Math.min(1,max/Math.max(w,h));
  var cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
  var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
  var cx=cv.getContext("2d"); cx.fillStyle="#000"; cx.fillRect(0,0,cw,ch); cx.drawImage(src,0,0,cw,ch);
  return { url:cv.toDataURL("image/jpeg",q), w:cw, h:ch };
}

var geoBox=$("#geo");
function reverseGeo(lat,lng){
  fetch("https://photon.komoot.io/reverse?lat="+lat+"&lon="+lng+"&limit=1&lang=default")
    .then(function(r){ return r.json(); }).then(function(j){
      var f=(j.features||[])[0]; if(!f||!ed) return;
      var pr=f.properties||{};
      var nm=[pr.name,pr.district||pr.city,pr.state].filter(Boolean).join("·");
      if(nm&&!ed.place){ ed.place=nm; var el=$("#edPlace"); if(el&&!el.value) el.value=nm; }
    }).catch(function(){});
}
var doGeo=debounce(function(q){
  if(!q||q.length<2){ geoBox.classList.remove("open"); return; }
  var m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m){
    var a=parseFloat(m[1]), b=parseFloat(m[2]);
    var lat=Math.abs(a)<=90?a:b, lng=Math.abs(a)<=90?b:a;
    geoBox.innerHTML=""; var it=ce("div","it","<b>跳到坐标 "+lat+", "+lng+"</b><span>按 WGS-84 定位</span>");
    it.onclick=function(){ map.flyTo(disp(lat,lng),16,{duration:.9}); geoBox.classList.remove("open"); };
    geoBox.appendChild(it); geoBox.classList.add("open"); return;
  }
  fetch("https://photon.komoot.io/api/?limit=6&lang=default&q="+encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(j){
      var fs=j.features||[];
      if(!fs.length){ geoBox.classList.remove("open"); return; }
      geoBox.innerHTML="";
      fs.forEach(function(f){
        var pr=f.properties||{}, c=f.geometry.coordinates;
        var name=pr.name||pr.street||pr.city||"未命名";
        var sub=[pr.street,pr.district,pr.city,pr.state,pr.country].filter(Boolean).join(" · ");
        var it=ce("div","it","<b>"+esc(name)+"</b><span>"+esc(sub)+"</span>");
        it.onclick=function(){
          map.flyTo(disp(c[1],c[0]),15,{duration:1});
          geoBox.classList.remove("open");
        };
        geoBox.appendChild(it);
      });
      geoBox.classList.add("open");
    }).catch(function(){ geoBox.classList.remove("open"); });
},420);

        fetch(SB_URL+"/rest/v1/rpc/verify_expense_secret",{method:"POST",
          headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"x-app-secret":v,"Content-Type":"application/json"},body:"{}"})
          .then(function(r){ return r.json(); })
          .then(function(ok){
            if(ok===true){ S.secret=v; localStorage.setItem(LS_SECRET,v); closeModal(); toast("已解锁"); bootstrapCloud(); }
            else { setSync("locked"); toast("密钥不对"); }
          }).catch(function(){ setSync("offline"); toast("连不上云端"); });
      }}]);
    return;
  }
  if(S.cloud==="needsetup"){ setupModal(); return; }
  modal("云同步",
    '<div class="crd"><h4>状态：'+esc($("#syncTxt").textContent)+'</h4><p>共 '+S.places.length+' 个回忆点。数据存在你自己的 Supabase 里，浏览器同时留一份离线缓存。</p></div>'+
    '<div class="hint">换设备打开这个网址、输入同一把密钥，回忆就都在。</div>',
    [{t:"退出解锁",f:function(){ S.secret=""; localStorage.removeItem(LS_SECRET); setSync("locked"); closeModal(); toast("已退出云同步，本地数据保留"); }},
     {t:"重新同步",p:true,f:function(){ closeModal(); bootstrapCloud(); }}]);
}
function setupModal(){
  modal("云端还差一步",
    '<div class="crd"><h4>建两张表就好</h4><p>复制下面这段 SQL，去 Supabase 控制台的 SQL Editor 粘贴运行一次。之后所有设备就都能看到同一份回忆了。</p></div>'+
    '<div class="sql" id="sqlBox">'+esc(SETUP_SQL)+'</div>'+
    '<div class="hint">运行完回来点「我建好了」。在此之前照片和回忆都只存在这台设备上。</div>',
    [{t:"复制 SQL",f:function(){ copyText(SETUP_SQL); }},{t:"我建好了",p:true,f:function(){ closeModal(); bootstrapCloud(); }}]);
}
var setupShown=false;
function promptSetup(){
  if(setupShown) return; setupShown=true;
  var tries=0;
  (function wait(){
    if(S.cloud!=="needsetup") return;
    if(!$("#modal").classList.contains("on")) return setupModal();
    if(++tries>50) return;
    setTimeout(wait,600);
  })();
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ toast("已复制"); },function(){ fallbackCopy(t); }); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("请手动复制"); }
  ta.remove();
}

/* ================= export / import ================= */
function doExport(){
  toast("打包中…");
  idbAll().then(function(photos){
    var blob=new Blob([JSON.stringify({app:"memory-map",v:1,exportedAt:new Date().toISOString(),places:S.places,photos:photos},null,1)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="回忆地图备份-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    toast("已导出 "+S.places.length+" 个地点 / "+photos.length+" 张照片");
  });
}
$("#jsonIn").onchange=function(e){
  var f=(e.target.files||[])[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var ps=d.places||[], phs=d.photos||[], add=0, upd=0;
      ps.forEach(function(p){
        if(!p||!p.id||!isFinite(p.lat)||!isFinite(p.lng)) return;
        var old=byId(p.id);
        if(!old){ S.places.push(p); add++; }
        else if((p.updatedAt||0)>(old.updatedAt||0)){ Object.assign(old,p); upd++; }
      });
      phs.forEach(function(x){ if(x&&x.id&&x.img){ idbPut(x); pushPhoto(x); } });
      saveLocal(); renderAll();
      S.places.forEach(pushPlace);
      toast("导入完成：新增 "+add+"，更新 "+upd);
    }catch(err){ toast("文件读不出来"); }
  };
  fr.readAsText(f);
  e.target.value="";
};

/* ================= wiring ================= */
$("#listBtn").onclick=function(){ var d=$("#drawer"); d.classList.toggle("hide"); $("#listBtn").classList.toggle("on",!d.classList.contains("hide")); };
$("#lyrBtn").onclick=function(){ var p=$("#lyrPanel"); p.classList.toggle("open"); $("#lyrBtn").classList.toggle("on",p.classList.contains("open")); };
$("#syncChip").onclick=syncPanel;
$("#shClose").onclick=function(){ if(ed) cancelEdit(); else closeSheet(); };
$("#fab").onclick=function(){
  if($("#tip").classList.contains("on")){ stopPick(); return; }
  startPick(null);
  if(window.innerWidth<=640) $("#drawer").classList.add("hide");
};
$("#mNow").onclick=function(){ setMode("now"); };
$("#mPast").onclick=function(){ setMode("past"); };
$("#cmpBtn").onclick=function(){
  if(S.mode!=="past"){ setMode("past"); }
  S.cmp=!S.cmp; syncCmp(); if(S.cmp) toast("拖动中间圆点：左边过去，右边现在");
};
$("#rng").oninput=function(){
  if(S.baseId==="eox"){ S.eoxYear=EOX_YEARS[+this.value]; buildBase(); renderTimeline(); renderMarkers(); renderList(); }
  else gotoPos(+this.value);
};
$("#prevB").onclick=function(){ stopPlay(); step(-1); };
$("#nextB").onclick=function(){ stopPlay(); step(1); };
function step(d){
  if(S.baseId==="eox"){ var i=clamp(EOX_YEARS.indexOf(S.eoxYear)+d,0,EOX_YEARS.length-1); S.eoxYear=EOX_YEARS[i]; buildBase(); renderTimeline(); renderMarkers(); renderList(); }
  else { var pos=relList.indexOf(S.relIdx); if(pos<0) pos=nearestPos(S.relIdx); gotoPos(pos+d); }
}
$("#playB").onclick=togglePlay;
$("#onlyChg").onclick=function(){
  S.onlyChg=!S.onlyChg;
  if(S.onlyChg) refineChanged(); else resetChanged();
  renderTimeline();
};
$("#syncPts").onclick=function(){ S.syncPts=!S.syncPts; renderTimeline(); renderMarkers(); renderList(); };
$("#q").oninput=function(){ S.q=this.value; $("#qx").style.display=this.value?"block":"none"; renderMarkers(); renderList(); doGeo(this.value); };
$("#qx").onclick=function(){ $("#q").value=""; S.q=""; this.style.display="none"; geoBox.classList.remove("open"); renderMarkers(); renderList(); };
$("#expBtn").onclick=doExport;
$("#impBtn").onclick=function(){ $("#jsonIn").click(); };
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if($("#lb").classList.contains("on")) return $("#lbClose").click();
    if($("#modal").classList.contains("on")) return closeModal();
    if($("#tip").classList.contains("on")) return stopPick();
    if($("#sheet").classList.contains("open")) return ed?cancelEdit():closeSheet();
  }
  if($("#lb").classList.contains("on")){
    if(e.key==="ArrowLeft") $("#lbPrev").click();
    if(e.key==="ArrowRight") $("#lbNext").click();
  }
  if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(S.mode==="past"){
    if(e.key==="ArrowLeft"){ stopPlay(); step(-1); }
    if(e.key==="ArrowRight"){ stopPlay(); step(1); }
  }
});
map.on("moveend zoomend",function(){
  try{ localStorage.setItem(LS_VIEW,JSON.stringify({c:map.getCenter(),z:map.getZoom(),g:activeGroup()})); }catch(e){}
});

function renderAll(){ renderLayerPanel(); renderTimeline(); renderMarkers(); renderList(); }
var didFit=false;
function fitIfFirst(){
  if(didFit||!S.places.length) return;
  var saved=null; try{ saved=JSON.parse(localStorage.getItem(LS_VIEW)||"null"); }catch(e){}
  if(saved&&saved.c) return;
  didFit=true;
  var pts=S.places.map(function(p){ var ll=disp(p.lat,p.lng); return [ll[0],ll[1]]; });
  if(pts.length===1) map.setView(pts[0],15);
  else map.fitBounds(L.latLngBounds(pts).pad(.25));
}

/* ================= boot ================= */
loadLocal();
(function initView(){
  var saved=null; try{ saved=JSON.parse(localStorage.getItem(LS_VIEW)||"null"); }catch(e){}
  if(saved&&saved.c&&isFinite(saved.c.lat)){
    var c=[saved.c.lat,saved.c.lng];
    if(saved.g!==activeGroup()) c=(activeGroup()==="gcj")?wgs2gcj(c[0],c[1]):gcj2wgs(c[0],c[1]);
    map.setView(c,saved.z||5);
  }else{
    map.setView([32.5,112.5],4.5);
  }
})();
buildBase();
renderAll();
fitIfFirst();
setSync(S.secret?"busy":"local");
if(S.secret) bootstrapCloud(); else setSync("local","本地");
if(!S.places.length){
  setTimeout(function(){
    modal("这是你的回忆地图",
      '<div class="crd"><h4>怎么用</h4><p>1　点右下「＋ 标记回忆」，在地图上按下那个地方。<br>2　写下时间、故事，挂几张照片。<br>3　底部切到「时光机」，把滑块往左拖 —— 2014 年以来的卫星影像一年年倒回去，拆掉的老屋、填掉的河、砍掉的树，都还在那些旧图里。</p></div>'+
      '<div class="crd"><h4>关于老家</h4><p>找到老家的位置后点开它，选「看这里的过去」，再打开「卷帘对比」：屏幕左边是过去，右边是现在，一条线拖过去，就是这些年发生的事。</p></div>'+
      '<div class="hint">想在手机和电脑上看同一份回忆，点左上角状态按钮解锁云同步。</div>',
      [{t:"知道了",p:true,f:closeModal}]);
  },700);
}
window.MM={S:S,map:map,byId:byId,WB:WB};
})();

</script>
